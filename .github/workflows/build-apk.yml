name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare project
        run: |
          test -f index.html || { echo "ERROR: index.html repo ke root par nahi hai"; ls -la; exit 1; }
          mkdir -p www/lib
          cp index.html www/index.html
          cat > package.json <<'EOT'
          {
            "name": "mr-asrar-pdf-editor",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/filesystem": "^7.0.0",
              "@capacitor/share": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOT
          cat > capacitor.config.json <<'EOT'
          {
            "appId": "com.mrasrar.pdfeditor",
            "appName": "Mr Asrar PDF Editor",
            "webDir": "www"
          }
          EOT

      - name: Bundle libraries (offline use)
        run: |
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fL $B/pdf.js/3.11.174/pdf.min.js -o www/lib/pdf.min.js
          curl -fL $B/pdf.js/3.11.174/pdf.worker.min.js -o www/lib/pdf.worker.min.js
          curl -fL $B/pdf-lib/1.17.1/pdf-lib.min.js -o www/lib/pdf-lib.min.js
          curl -fL $B/qrcode-generator/1.4.4/qrcode.min.js -o www/lib/qrcode.min.js
          sed -i "s#$B/pdf.js/3.11.174/#lib/#g; s#$B/pdf-lib/1.17.1/#lib/#g; s#$B/qrcode-generator/1.4.4/#lib/#g" www/index.html

      - run: npm install
      - run: npx cap add android

      - name: Storage permission (old Android) for saving PDFs
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "WRITE_EXTERNAL_STORAGE" android/app/src/main/AndroidManifest.xml

      - name: Apply logo and screen fit
        run: |
          pip install --break-system-packages pillow || python3 -m pip install pillow || true
          LOGO=$(ls | grep -iE '\.(png|jpe?g|webp)$' | head -1)
          echo "Logo file: '${LOGO}'"
          [ -n "$LOGO" ] || echo "WARNING: root par koi image (logo) nahi mili, default icon rahega"
          LOGO="$LOGO" python3 - <<'PY'
          import os, glob
          from PIL import Image, ImageDraw
          BG = (1, 22, 77, 255)
          res = "android/app/src/main/res"
          if os.environ.get("LOGO"):
              src = Image.open(os.environ["LOGO"]).convert("RGBA")
              w, h = src.size
              s = min(w, h)
              src = src.crop(((w - s) // 2, (h - s) // 2, (w - s) // 2 + s, (h - s) // 2 + s))
              if src.getpixel((2, 2))[3] == 255:
                  m = Image.new("L", (s * 2, s * 2), 0)
                  ImageDraw.Draw(m).ellipse((10, 10, s * 2 - 10, s * 2 - 10), fill=255)
                  src.putalpha(m.resize((s, s), Image.LANCZOS))
              legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              for d, px in legacy.items():
                  folder = f"{res}/mipmap-{d}"
                  os.makedirs(folder, exist_ok=True)
                  icon = src.resize((px, px), Image.LANCZOS)
                  icon.save(f"{folder}/ic_launcher.png")
                  icon.save(f"{folder}/ic_launcher_round.png")
                  fg = Image.new("RGBA", (px * 9 // 4, px * 9 // 4), (0, 0, 0, 0))
                  inner = int(fg.size[0] * 0.66)
                  fg.paste(src.resize((inner, inner), Image.LANCZOS), ((fg.size[0] - inner) // 2,) * 2)
                  fg.save(f"{folder}/ic_launcher_foreground.png")
              os.makedirs(f"{res}/values", exist_ok=True)
              open(f"{res}/values/ic_launcher_background.xml", "w").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                  '    <color name="ic_launcher_background">#01164D</color>\n</resources>\n')
              for p in glob.glob(f"{res}/drawable*/splash.png"):
                  W, H = Image.open(p).size
                  canvas = Image.new("RGBA", (W, H), BG)
                  side = int(min(W, H) * 0.45)
                  canvas.alpha_composite(src.resize((side, side), Image.LANCZOS), ((W - side) // 2, (H - side) // 2))
                  canvas.convert("RGB").save(p)
          import re
          sp = f"{res}/values/styles.xml"
          x = open(sp).read()
          extra = ('\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>'
                   '\n        <item name="android:statusBarColor">#0F1020</item>'
                   '\n        <item name="android:navigationBarColor">#0F1020</item>'
                   '\n        <item name="android:windowLightStatusBar">false</item>'
                   '\n        <item name="android:windowLightNavigationBar">false</item>')
          x = re.sub(r'(<style name="AppTheme(?:\.NoActionBar)?"[^>]*>)', lambda m: m.group(1) + extra, x)
          open(sp, "w").write(x)
          print(x)
          PY

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MrAsrar-PDF-Editor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
